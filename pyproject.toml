[project]
name = "krasnal-think"
version = "0.1.0"
description = "A chess transformer that reasons in UCI before moving."
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.8",
    "numpy>=2.1",
    "chess>=1.11",
    "duckdb>=1.1",
    "huggingface-hub>=0.34",
    "tqdm>=4.67",
    "wandb>=0.19",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "krasnal_think"
module-root = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
